<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Materiallist-Litematica</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%235a8f3c'/><rect y='10' width='16' height='6' fill='%23795537'/></svg>">
<style>
:root{
  --bg:#16181b; --panel:#1e2126; --panel2:#252930; --line:#30353d; --text:#e6e8eb; --muted:#9097a1;
  --accent:#6fbf4a; --accent-d:#4f8f34; --warn:#e3a33b; --danger:#e05b52; --shulker:#a77ec9;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:6px 10px}
button:hover{border-color:#4a515c}
button.primary{background:var(--accent-d);border-color:var(--accent-d);color:#fff}
button.primary:hover{background:var(--accent)}
button.ghost{background:none;border-color:transparent;color:var(--muted)}
button.ghost:hover{color:var(--text);border-color:var(--line)}
button.danger:hover{border-color:var(--danger);color:var(--danger)}
input[type=text],input[type=number],input[type=search],select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent-d);outline-offset:-1px}
.app{display:grid;grid-template-columns:290px 1fr;height:100vh}
aside{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.brand{padding:16px 16px 10px;display:flex;gap:10px;align-items:center}
.brand .logo{width:28px;height:28px;border-radius:4px;background:linear-gradient(#6fbf4a 0 40%,#795537 40%);box-shadow:inset 0 0 0 2px rgba(0,0,0,.25)}
.brand h1{font-size:16px;margin:0;letter-spacing:.2px}
.brand small{color:var(--muted);display:block;font-size:12px}
.drop{margin:6px 12px 10px;border:1.5px dashed var(--line);border-radius:10px;padding:14px;text-align:center;color:var(--muted);transition:.15s}
.drop.over{border-color:var(--accent);background:rgba(111,191,74,.08);color:var(--text)}
.drop b{color:var(--text)}
.drop .row{display:flex;gap:6px;justify-content:center;margin-top:8px}
.plist{overflow:auto;flex:1;padding:0 8px 12px}
.plist h3{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:10px 8px 6px;display:flex;justify-content:space-between;align-items:center}
.pitem{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:center;padding:8px;border-radius:8px;cursor:pointer;border:1px solid transparent}
.pitem:hover{background:var(--panel2)}
.pitem.active{background:var(--panel2);border-color:var(--line)}
.pitem .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.pitem .sub{font-size:12px;color:var(--muted);display:flex;gap:8px}
.bar{height:4px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:4px}
.bar>i{display:block;height:100%;background:var(--accent)}
.empty-side{color:var(--muted);font-size:13px;padding:8px}
main{overflow:auto;min-width:0}
.top{position:sticky;top:0;z-index:5;background:rgba(22,24,27,.94);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding:14px 24px 0}
.titlebar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.titlebar input.title{font-size:20px;font-weight:650;background:none;border:1px solid transparent;padding:2px 6px;margin-left:-7px;min-width:200px;flex:1}
.titlebar input.title:hover{border-color:var(--line)}
.meta{color:var(--muted);font-size:12px;margin:2px 0 10px;display:flex;gap:14px;flex-wrap:wrap}
.tabs{display:flex;gap:2px;overflow-x:auto}
.tab{white-space:nowrap;background:none;border:none;border-bottom:2px solid transparent;border-radius:0;padding:8px 12px;color:var(--muted)}
.tab.on{color:var(--text);border-bottom-color:var(--accent)}
.content{padding:18px 24px 60px;max-width:1200px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.stat .k{color:var(--muted);font-size:12px}
.stat .v{font-size:22px;font-weight:650;font-variant-numeric:tabular-nums}
.stat .v small{font-size:13px;color:var(--muted);font-weight:400}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar input[type=search]{flex:1;min-width:180px}
.toolbar label{display:flex;gap:6px;align-items:center;color:var(--muted);font-size:13px;user-select:none}
table{width:100%;border-collapse:collapse}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;text-align:left;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none}
th.num,td.num{text-align:right}
td{padding:7px 8px;border-bottom:1px solid #262a30;vertical-align:middle;font-variant-numeric:tabular-nums}
tr.item:hover td{background:#1b1e22}
tr.done td{opacity:.5}
tr.done .iname{text-decoration:line-through}
.cat td{background:var(--bg);color:var(--muted);font-size:12px;font-weight:600;padding-top:16px;border-bottom:1px solid var(--line)}
.icon{width:22px;height:22px;border-radius:4px;display:inline-grid;place-items:center;font:700 9px/1 var(--mono);color:rgba(0,0,0,.65);box-shadow:inset 0 0 0 1px rgba(0,0,0,.3),inset 2px 2px 0 rgba(255,255,255,.18);flex:none}
.icon.tex{width:28px;height:28px;background:none;box-shadow:none;border-radius:0;object-fit:contain}
.icon.tex.flat{image-rendering:pixelated;padding:2px}
.icon.tex.standin{opacity:.75}
.iname{display:flex;align-items:center;gap:9px;min-width:0}
.iname span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iname .id{color:var(--muted);font:11px var(--mono);margin-left:4px}
.chk{width:18px;height:18px;accent-color:var(--accent);cursor:pointer}
.st{color:var(--muted);font-size:13px;white-space:nowrap}
.st b{color:var(--text);font-weight:600}
.sb{color:var(--shulker);white-space:nowrap}
.have{display:flex;gap:4px;align-items:center;justify-content:flex-end}
.have input{width:78px;text-align:right;padding:4px 6px}
.have button{padding:3px 7px;font-size:12px}
.pill{font-size:11px;padding:2px 7px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.raw{border-color:var(--warn);color:var(--warn)}
.pill.next{border-color:var(--accent);color:var(--accent)}
.pill.sync{border-color:var(--accent);color:var(--accent);margin-right:4px}
.sub2{font-size:11.5px;color:var(--muted);font-weight:400}
.sub2.rec{margin:2px 0 0 37px;white-space:normal}
.sub2 .ok{color:var(--text)} .sub2 .no{color:var(--danger)}
.chip{display:inline-block;font-size:12px;padding:2px 8px;border-radius:6px;border:1px solid var(--line);margin:2px 4px 2px 0}
.chip.ok{border-color:var(--accent-d);color:var(--accent)} .chip.muted{color:var(--muted)} .chip.no{border-color:var(--danger);color:var(--danger)}
.chip .icon{width:16px;height:16px;vertical-align:-3px;padding:0}
.goal{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--line);border-radius:10px;padding:10px 14px;margin:8px 0}
.goal.ready{border-left-color:var(--accent)} .goal.wait{border-left-color:var(--warn)}
.goal-h{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.goal-need{margin:8px 0 2px 27px}
.goal-need .lbl{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:3px}
.goal details{margin:6px 0 0 27px;font-size:13px}
.goal summary{cursor:pointer;color:var(--muted)}
.goal-steps{margin:6px 0 2px;padding-left:22px}
.goal-steps li{padding:2px 0}
.refresh{display:inline-flex;align-items:center;gap:2px}
.refresh select{padding:3px 6px;font-size:12px;color:var(--muted);background:none}
.refresh #refreshBtn{font-size:16px;padding:2px 8px}
.notice{background:var(--panel);border:1px solid var(--shulker);border-radius:10px;padding:10px 14px;margin-bottom:14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.have .pin{padding:2px 5px;color:var(--warn)}
.hero{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:10px;padding:14px 18px;margin-bottom:12px}
.hero.gather{border-left-color:var(--warn)}
.hero-k{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:6px}
.hero-row{display:flex;gap:14px;align-items:center}
.hero-row .icon{width:44px;height:44px}
.hero-t{font-size:20px;font-weight:650}
.hero-s{color:var(--muted);margin-top:2px}
h3.sec{font-size:14px;margin:22px 0 4px}
h3.sec small{color:var(--muted);font-weight:400;margin-left:6px}
tr.nextup td{background:rgba(227,163,59,.07)}
.donebox{margin-top:22px}
.donebox summary{cursor:pointer;color:var(--muted);padding:6px 0}
.expand{width:24px;padding:2px 0;font-size:11px}
.tree{background:var(--panel);border-radius:8px;padding:10px 14px;margin:2px 0 8px;font-size:13px}
.tree ul{list-style:none;margin:0;padding-left:20px;border-left:1px dashed var(--line)}
.tree>ul{padding-left:0;border:none}
.tree li{padding:3px 0}
.tree .n{display:inline-flex;gap:7px;align-items:center}
.tree .x{color:var(--muted);font-size:12px}
.tree .cnt{font-weight:600;min-width:42px;display:inline-block;text-align:right}
.note{color:var(--muted);font-size:12.5px;margin:8px 0 14px;max-width:780px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
.card h2{font-size:15px;margin:0 0 10px}
.steps li{margin:6px 0}
.steps .rec{color:var(--muted);font-size:12.5px}
.welcome{max-width:720px;margin:60px auto;padding:0 24px}
.welcome h2{font-size:24px;margin-bottom:6px}
.welcome ul{color:var(--muted)}
.toast{position:fixed;bottom:18px;right:18px;background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--accent);padding:10px 14px;border-radius:8px;max-width:420px;box-shadow:0 8px 30px rgba(0,0,0,.4);z-index:50}
.toast.err{border-left-color:var(--danger)}
textarea{width:100%;min-height:200px;resize:vertical}
.kbd{font:11px var(--mono);border:1px solid var(--line);border-radius:4px;padding:1px 5px;color:var(--muted)}
.combo-chk{accent-color:var(--shulker)}
.content.wide{max-width:none}
.v3d{position:relative;height:calc(100vh - 230px);min-height:380px;background:#131518;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.v3d canvas{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
.v3d canvas:active{cursor:grabbing}
.v3d-msg{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);text-align:center;padding:20px}
.v3d-ui{position:absolute;left:12px;top:12px;background:rgba(30,33,38,.9);border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;width:250px;max-width:calc(100% - 24px);font-size:13px}
.v3d-ui input[type=range]{width:100%;accent-color:var(--accent);padding:0}
.v3d-ui .row{display:flex;gap:6px;align-items:center;justify-content:space-between}
.v3d-ui label{display:flex;gap:6px;align-items:center;color:var(--muted);user-select:none}
.v3d-ui button{padding:3px 8px;font-size:12px}
.v3d-layer{max-height:190px;overflow:auto;border-top:1px solid var(--line);padding-top:6px;display:flex;flex-direction:column;gap:3px}
.v3d-layer div{display:flex;align-items:center;gap:6px}
.v3d-layer .icon.tex{width:20px;height:20px}
.v3d-layer b{margin-left:auto;font-variant-numeric:tabular-nums}
.v3d-help{position:absolute;right:12px;bottom:10px;color:var(--muted);font-size:12px;pointer-events:none;text-shadow:0 1px 2px #000}
@media (max-width:860px){
  .app{grid-template-columns:1fr;height:auto}
  aside{max-height:none;border-right:none;border-bottom:1px solid var(--line)}
  .plist{max-height:260px}
  .grid2{grid-template-columns:1fr}
  .hide-m{display:none}
  .top,.content{padding-left:16px;padding-right:16px}
}
@media print{
  aside,.tabs,.toolbar,.have button,.expand,.top button,.v3d,.refresh{display:none!important}
  .app{display:block}
  body{background:#fff;color:#000}
  td,th{border-color:#ccc!important;color:#000!important}
  .top{position:static;background:#fff}
}
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand"><div class="logo"></div><div style="min-width:0;flex:1"><h1>Materiallist-Litematica</h1><small id="who">Litematica &amp; JSON</small></div></div>
    <div class="drop" id="drop">
      <b>Drop files here</b><br>.litematic or .json, several at once
      <div class="row">
        <button class="primary" id="pick">Choose files</button>
        <button id="newEmpty" title="Create an empty project">+ Empty</button>
      </div>
      <input type="file" id="file" multiple accept=".litematic,.json" hidden>
    </div>
    <div class="plist" id="plist"></div>
  </aside>
  <main id="main"></main>
</div>

<script src="logic.js"></script>
<script src="mcmodel.js"></script>
<script src="render.js"></script>
<script>
'use strict';
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const LOCALE = 'en-US';
const fmt = (n) => Number(n).toLocaleString(LOCALE);
const SHULKER = 27;

const S = {
  me: null, projects: [], current: null, combo: new Set(), view: 'list', custom: {},
  filter: '', hideDone: false, rawShowDone: false, refresh: 5, groupCat: true, sort: 'count', open: new Set(),
};
try { Object.assign(S, JSON.parse(localStorage.getItem('mcml-ui') || '{}'), { projects: [], current: null, open: new Set() }); S.combo = new Set(S.combo || []); } catch { S.combo = new Set(); }
function saveUi() { try { localStorage.setItem('mcml-ui', JSON.stringify({ view: S.view, refresh: S.refresh, rawShowDone: S.rawShowDone, hideDone: S.hideDone, groupCat: S.groupCat, sort: S.sort, combo: [...S.combo], lastId: S.current && S.current.id })); } catch {} }

async function api(path, opts) {
  const r = await fetch('/api' + path, opts);
  const j = await r.json().catch(() => ({}));
  if (r.status === 401) showLogin();
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}
// Not logged in: login goes through the game so nobody can use someone else's name
function showLogin() {
  S.me = null; S.current = null; S.projects = [];
  $('#who').innerHTML = '';
  $('#plist').innerHTML = '';
  $('#drop').hidden = true;
  $('#main').innerHTML = `<div class="welcome"><h2>Log in</h2>
    <p style="color:var(--muted)">Login goes through the game:</p>
    <ol style="line-height:1.9"><li>Join the Minecraft server.</li><li>Type <span class="kbd">/materiallist login</span> in chat.</li><li>Click the link that appears in chat.</li></ol>
    <p class="note">The link is valid for 5 minutes and only for you. After that you stay logged in in this browser for 30 days.</p></div>`;
}
function toast(msg, err) {
  const t = document.createElement('div');
  t.className = 'toast' + (err ? ' err' : '');
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), err ? 7000 : 3500);
}

/* ---------- Display helpers ---------- */
function icon(id) {
  const ic = MC3D.iconFor(id);
  if (ic) return `<img class="icon tex${ic.flat ? ' flat' : ''}${ic.standin ? ' standin' : ''}" src="${ic.url}" alt=""${ic.standin ? ' title="Placeholder icon (unknown wood type)"' : ''}>`;
  const h = MC.hueOf(id);
  const s = MC.short(id).replace(/^#/, '');
  const ab = s.split('_').filter(Boolean).slice(0, 2).map((w) => w[0]).join('').toUpperCase();
  return `<span class="icon"${ic === undefined ? ` data-icon="${esc(id)}"` : ''} style="background:hsl(${h} 45% 58%)">${esc(ab)}</span>`;
}
// As soon as textures and models are loaded, replace the letter placeholders with real icons
MCA.ready.then(() => document.querySelectorAll('[data-icon]').forEach((el) => { el.outerHTML = icon(el.dataset.icon); }));
function stackText(id, n) {
  if (n <= 0) return '<span class="st">–</span>';
  const ss = MC.stackSize(id);
  const st = Math.floor(n / ss), rest = n % ss;
  if (st === 0) return `<span class="st"><b>${rest}</b></span>`;
  return `<span class="st"><b>${st}</b> × ${ss}${rest ? ` + <b>${rest}</b>` : ''}</span>`;
}
function shulkerText(id, n) {
  if (n <= 0) return '<span class="st">–</span>';
  const slots = MC.slotsFor(id, n);
  const sb = slots / SHULKER;
  if (slots < SHULKER) return `<span class="st">${slots} Slots</span>`;
  const full = Math.floor(sb), restSlots = slots - full * SHULKER;
  return `<span class="sb">${full} SB${restSlots ? ` <span class="st">+ ${restSlots} Slots</span>` : ''}</span>`;
}
function totalsFor(items, n = (i) => i.count) {
  let total = 0, slots = 0;
  for (const i of items) { const c = n(i); if (c > 0) { total += c; slots += MC.slotsFor(i.id, c); } }
  return { total, slots, shulkers: slots / SHULKER };
}
const resolveOpts = (p) => ({ custom: S.custom, stop: new Set(p.stopItems || []) });

/* ---------- Sidebar ---------- */
function renderSidebar() {
  const el = $('#plist');
  if (!S.projects.length) { el.innerHTML = '<h3>Projects</h3><div class="empty-side">No projects yet. Upload a file.</div>'; return; }
  const combos = S.projects.filter((p) => S.combo.has(p.id)).length;
  el.innerHTML = `<h3><span>Projects (${S.projects.length})</span>${combos >= 1 ? `<button class="ghost" id="openCombo" style="padding:2px 6px;font-size:11px;color:var(--shulker)">Combined (${combos}) →</button>` : ''}</h3>` +
    S.projects.map((p) => {
      const pct = p.total ? Math.round((p.done / p.total) * 100) : 0;
      const active = S.current && S.current.id === p.id && !S.current.combo;
      return `<div class="pitem ${active ? 'active' : ''}" data-id="${p.id}">
        <input type="checkbox" class="chk combo-chk" title="Select for combined overview" data-combo="${p.id}" ${S.combo.has(p.id) ? 'checked' : ''}>
        <div style="min-width:0"><div class="nm">${esc(p.name)}</div>
          <div class="sub"><span>${p.types} types</span><span>${fmt(p.total)} items</span><span>${pct}%</span>${p.mine ? '' : `<span title="Shared with you">by ${esc(p.owner)}</span>`}</div>
          <div class="bar"><i style="width:${pct}%"></i></div></div></div>`;
    }).join('');
}
$('#plist').addEventListener('click', (e) => {
  const cb = e.target.closest('[data-combo]');
  if (cb) {
    const id = cb.dataset.combo;
    cb.checked ? S.combo.add(id) : S.combo.delete(id);
    saveUi(); renderSidebar();
    if (S.current && S.current.combo) openCombo();
    return;
  }
  if (e.target.closest('#openCombo')) return openCombo();
  const it = e.target.closest('.pitem');
  if (it) openProject(it.dataset.id);
});

async function loadProjects() { S.projects = await api('/projects'); renderSidebar(); }

/* ---------- Upload ---------- */
async function uploadFiles(files) {
  let last = null, ok = 0;
  for (const f of files) {
    try {
      const r = await fetch('/api/upload?filename=' + encodeURIComponent(f.name), { method: 'POST', body: f });
      const j = await r.json().catch(() => ({}));
      if (r.status === 401) return showLogin();
      if (!r.ok) throw new Error(j.error);
      last = j.id; ok++;
    } catch (e) { toast(e.message, true); }
  }
  if (ok) toast(`${ok} project${ok > 1 ? 's' : ''} imported`);
  await loadProjects();
  if (last) openProject(last);
}
const drop = $('#drop');
$('#pick').onclick = () => $('#file').click();
$('#file').onchange = (e) => { uploadFiles([...e.target.files]); e.target.value = ''; };
['dragenter', 'dragover'].forEach((ev) => document.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.add('over'); }));
['dragleave', 'drop'].forEach((ev) => document.addEventListener(ev, (e) => { e.preventDefault(); if (ev === 'drop' || !e.relatedTarget) drop.classList.remove('over'); }));
document.addEventListener('drop', (e) => { if (e.dataTransfer.files.length) uploadFiles([...e.dataTransfer.files]); });
$('#newEmpty').onclick = async () => {
  const p = await api('/projects', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name: 'New project', items: [] }) });
  await loadProjects(); openProject(p.id); S.view = 'edit'; render();
};

/* ---------- Load / save project ---------- */
let saveTimer = null, saving = 0, pending = null;
function persist(fields) {
  const p = S.current;
  if (!p || p.combo) return;
  // several changes in quick succession are saved together
  pending = Object.assign(pending || {}, fields || { _state: true });
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    const body = pending;
    pending = null; saveTimer = null; saving++;
    if (body._state) { delete body._state; body.stock = p.stock; body.stopItems = p.stopItems; }
    try {
      const sum = await api('/projects/' + p.id, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
      const i = S.projects.findIndex((x) => x.id === sum.id);
      if (i >= 0) S.projects[i] = sum;
      p.updated = sum.updated;   // our own change, no reason to reload
      renderSidebar();
    } catch (e) { toast('Saving failed: ' + e.message, true); }
    saving--;
  }, 350);
}
async function openProject(id) {
  try {
    S.current = await api('/projects/' + id);
    S.open.clear();
    saveUi(); renderSidebar(); render();
  } catch (e) { toast(e.message, true); }
}
async function openCombo() {
  const ids = S.projects.filter((p) => S.combo.has(p.id)).map((p) => p.id);
  if (!ids.length) return;
  const full = await Promise.all(ids.map((id) => api('/projects/' + id)));
  const items = MC.normalizeItems(full.flatMap((p) => p.items));
  // Manually entered amounts add up, the stock from the game is the same for all projects
  const stock = {}, fromGame = {}, placed = {};
  full.forEach((p) => {
    for (const k in p.stock) stock[k] = (stock[k] || 0) + p.stock[k];
    const sy = p.sync || {};
    for (const k in sy.stock || {}) if (!(k in p.stock)) fromGame[k] = Math.max(fromGame[k] || 0, sy.stock[k]);
    for (const k in sy.placed || {}) placed[k] = (placed[k] || 0) + sy.placed[k];
  });
  for (const k in fromGame) stock[k] = (stock[k] || 0) + fromGame[k];
  S.current = { combo: true, id: 'combo', name: 'Combined: ' + full.map((p) => p.name).join(' + '), parts: full, items, stock, sync: { placed }, stopItems: [...new Set(full.flatMap((p) => p.stopItems || []))] };
  if (S.view === 'edit') S.view = 'list';
  S.open.clear();
  renderSidebar(); render();
}

/* ---------- Next steps ---------- */
// A plan consumes stock: subtract what it uses and credit what is left over or produced by crafting
function applyPlan(pool, pl, rootId, credit = true) {
  for (const id in pl.nodes) {
    const n = pl.nodes[id], fromTag = pl.tagFrom[id] || {};
    let own = n.used;
    for (const k in fromTag) { own -= fromTag[k]; pool[k] = (pool[k] || 0) - fromTag[k]; }
    if (own) pool[id] = (pool[id] || 0) - own;
    const gain = id === rootId ? n.produced + n.used : n.produced - n.missing;
    if (credit && n.crafts && gain) pool[id] = (pool[id] || 0) + gain;
  }
}
/**
 * One goal per final product: which raw materials it needs in total and which crafting steps in which order.
 * Stock is distributed in turn: first to everything that can be completed with it.
 */
function goalsOf(p) {
  const st = stockOf(p), dem = MC.demandOf(p), opts = resolveOpts(p);
  const pool = Object.assign({}, st);
  const goals = [];
  const todo = p.items.filter((i) => dem[i.id] > 0).map((i) => ({ id: i.id, count: i.count, need: dem[i.id] }));
  const make = (g, ready) => {
    const pl = MC.plan({ [g.id]: g.need }, pool, opts), N = pl.nodes;
    if (ready && pl.gather.length) return false;
    g.plan = pl;
    g.have = N[g.id].used;
    g.left = g.need - g.have;                       // this many still have to be made
    g.raws = Object.values(N).filter((n) => !n.recipe && n.need > 0 && n.id !== g.id).sort((a, b) => b.need - a.need);
    g.steps = Object.values(N).filter((n) => n.crafts > 0).sort((a, b) => a.depth - b.depth);
    g.raw = !N[g.id].recipe;                        // the final product is itself a raw material
    g.state = g.left === 0 ? 'have' : pl.gather.length ? 'wait' : 'ready';
    // If material is still missing, only consume and credit nothing: what can't be crafted yet isn't available to other goals
    applyPlan(pool, pl, g.id, g.state !== 'wait');
    if (g.state !== 'wait') pool[g.id] = (pool[g.id] || 0) - g.need;   // the finished pieces are reserved for building, not as ingredients for something else
    goals.push(g);
    return true;
  };
  const rest = todo.filter((g) => !make(g, true));
  rest.forEach((g) => make(g, false));
  return goals;
}
// Book manually: craft the whole chain of a goal (subtract ingredients, credit result and leftovers)
function doCraft(p, id) {
  const need = MC.demandOf(p)[id];
  if (!need) return;
  const st = stockOf(p), pl = MC.plan({ [id]: need }, st, resolveOpts(p));
  if (pl.gather.length) return toast('Material for this is still missing', true);
  const after = Object.assign({}, st);
  applyPlan(after, pl, id);
  for (const k in after) if ((after[k] || 0) !== (st[k] || 0)) p.stock[k] = Math.max(0, after[k]);
  touch(p); persist();
  toast(`${fmt(pl.nodes[id].produced)}× ${MC.displayName(id)} booked`);
}
function renderNext() {
  const p = S.current, pl = planOf(p), N = pl.nodes, st = stockOf(p);
  const goals = goalsOf(p);
  const own = (id) => st[id] || 0;
  const amount = (id, n) => `${fmt(n)}${n >= MC.stackSize(id) ? ` <span class="sub2" style="display:inline">(${stackText(id, n).replace(/<\/?span[^>]*>/g, '')})</span>` : ''}`;
  const ready = goals.filter((g) => g.state === 'ready'), wait = goals.filter((g) => g.state === 'wait'), have = goals.filter((g) => g.state === 'have');
  const left = Object.values(MC.demandOf(p)).reduce((a, b) => a + b, 0);

  // At the top: exactly one step
  let hero, heroId = null, heroCls = 'craft';
  if (ready.length) { const g = ready[0]; heroId = g.id; hero = `<div class="hero-t">Craft: ${fmt(g.left)}× ${esc(MC.displayName(g.id))}</div><div class="hero-s">You have all the material for it${ready.length > 1 ? `, and for ${ready.length - 1} more (see below)` : ''}.</div>`; }
  else if (pl.gather.length) { const id = pl.gather[0]; heroId = id; heroCls = 'gather'; hero = `<div class="hero-t">Gather: ${esc(MC.displayName(id))}</div><div class="hero-s">${amount(id, N[id].missing)} more · have ${fmt(N[id].have)} of ${fmt(N[id].need)}</div>`; }
  else if (left) hero = `<div class="hero-t">All materials are here – time to build</div><div class="hero-s">${fmt(left)} blocks left to place.</div>`;
  else hero = '<div class="hero-t">Done 🎉</div><div class="hero-s">Everything is placed.</div>';

  const chk = (id, done) => (p.combo ? '' : `<input type="checkbox" class="chk" data-act="toggle" ${done ? 'checked' : ''} title="${done ? 'Not actually there' : 'I already have it (without subtracting ingredients)'}">`);
  // One card per final product: what you need in total and how to craft it
  const card = (g) => {
    const raws = g.raws.map((n) => `<span class="chip ${n.missing ? 'no' : 'ok'}">${icon(n.id)} ${fmt(n.need)} ${esc(MC.displayName(n.id))}${n.missing ? ` · missing ${fmt(n.missing)}` : ' ✓'}</span>`).join('');
    const steps = g.steps.map((n) => `<li><b>${fmt(n.produced)}× ${esc(MC.displayName(n.id))}</b> <span class="sub2" style="display:inline">${esc(n.recipe.via || 'craft')} from ${Object.entries(n.recipe.in).map(([k, v]) => `${fmt(v * n.crafts)} ${esc(MC.displayName(k))}`).join(', ')}</span></li>`).join('');
    const status = g.state === 'ready' ? '<span class="pill next">ready to craft</span>' : g.state === 'have' ? '<span class="pill next">available, ready to place</span>' : '<span class="pill">material missing</span>';
    const body = g.state === 'have' ? ''
      : g.raw ? `<div class="goal-need">This is a raw material: just gather it. Have ${fmt(g.have)} of ${fmt(g.need)}.</div>`
      : `<div class="goal-need"><span class="lbl">You need in total</span>${raws || '<span class="sub2">only what you already have</span>'}</div>
         <details ${g.state === 'ready' ? 'open' : ''}><summary>${g.steps.length} crafting step${g.steps.length === 1 ? '' : 's'} in this order</summary><ol class="goal-steps">${steps}</ol></details>`;
    return `<div class="goal ${g.state}" data-id="${esc(g.id)}" data-need="${g.need}">
      <div class="goal-h">${chk(g.id, g.state === 'have')}${icon(g.id)}<b>${fmt(g.state === 'have' ? g.need : g.left)}× ${esc(MC.displayName(g.id))}</b>${g.have && g.left ? `<span class="sub2">${fmt(g.have)} of ${fmt(g.need)} already there</span>` : ''}${status}
        ${g.state === 'ready' && !p.combo && !p.sync ? '<button class="primary" data-act="craft" style="margin-left:auto" title="Subtract ingredients and credit the result">Crafted</button>' : ''}</div>${body}</div>`;
  };
  const rawRow = (id, i) => {
    const nd = N[id], done = nd.missing === 0, next = !done && i === 0 && heroCls === 'gather';
    const uses = goals.filter((g) => g.plan.nodes[id] && g.plan.nodes[id].need > 0 && g.id !== id).map((g) => esc(MC.displayName(g.id)));
    return `<tr class="item ${done ? 'done' : ''}${next ? ' nextup' : ''}" data-id="${esc(id)}" data-need="${own(id) + nd.missing}">
      <td style="width:34px">${chk(id, done)}</td>
      <td><div class="iname">${icon(id)}<span>${esc(MC.displayName(id))}</span>${next ? '<span class="pill next">next up</span>' : ''}</div>${uses.length && !done ? `<div class="sub2 rec">For: ${uses.slice(0, 6).join(', ')}${uses.length > 6 ? ' …' : ''}${nd.final ? ' · and to place directly' : ''}</div>` : ''}</td>
      <td class="num"><b>${fmt(nd.need)}</b></td>
      <td class="num">${haveCell(p, id, own(id))}${nd.have > own(id) ? `<div class="sub2">+ ${fmt(nd.have - own(id))} matching in stock</div>` : ''}</td>
      <td class="num" style="width:120px">${done ? '<span style="color:var(--accent)">✓</span>' : amount(id, nd.missing)}</td></tr>`;
  };
  const doneRaw = pl.done.filter((id) => !N[id].recipe);
  const sec = (title, hint, html) => (html ? `<h3 class="sec">${title} <small>${hint}</small></h3>${html}` : '');
  $('#content').innerHTML = `
    <div class="hero ${heroCls}"><div class="hero-k">Next step</div><div class="hero-row">${heroId ? icon(heroId) : ''}<div>${hero}</div></div></div>
    ${syncLine(p)}
    ${sec('Craft now', 'All material for these final products is here', ready.map(card).join(''))}
    ${sec('Gather', `${pl.gather.length} raw materials still missing, totaled for everything`, pl.gather.length ? `<table><thead><tr><th></th><th>Raw material</th><th class="num">Needed</th><th class="num">Have</th><th class="num">Missing</th></tr></thead><tbody>${pl.gather.map(rawRow).join('')}</tbody></table>` : '')}
    ${sec('Craft afterwards', 'Material is still missing here (red)', wait.map(card).join(''))}
    ${have.length || doneRaw.length ? `<details class="donebox"><summary>Done (${have.length} final products ready to place, ${doneRaw.length} raw materials complete)</summary>${have.map(card).join('')}${doneRaw.length ? `<table><tbody>${doneRaw.map(rawRow).join('')}</tbody></table>` : ''}</details>` : ''}
    <p class="note" style="margin-top:18px">Each card is a final product from your list, with everything you need for it in total and the crafting steps to get there. Intermediate products (sticks, planks, torches …) only show up there as steps. The checkmark means "I already have it". "Crafted" subtracts the ingredients of the whole chain and credits the result.</p>`;
  bindSync(p);
}

/* ---------- Raw materials ---------- */
function renderRaw() {
  const p = S.current, pl = planOf(p), N = pl.nodes, st = stockOf(p);
  const all = Object.values(N).filter((n) => !n.recipe && n.need > 0).sort((a, b) => b.need - a.need);
  const raws = all.filter((n) => S.rawShowDone || n.missing > 0);
  const tot = totalsFor(all, (n) => n.need);
  const rem = totalsFor(all, (n) => n.missing);
  const hidden = all.length - raws.length;
  const c = $('#content');
  c.innerHTML = `
    <div class="stats">
      <div class="stat"><div class="k">Raw material types</div><div class="v">${all.length} <small>${all.length - all.filter((n) => n.missing > 0).length} done</small></div></div>
      <div class="stat"><div class="k">Total needed</div><div class="v">${fmt(tot.total)}</div></div>
      <div class="stat"><div class="k">Still open</div><div class="v">${fmt(rem.total)}</div></div>
      <div class="stat"><div class="k">Inventory slots (open)</div><div class="v">${fmt(rem.slots)}</div></div>
      <div class="stat"><div class="k">Shulker boxes (open)</div><div class="v" style="color:var(--shulker)">${Math.ceil(rem.shulkers)} <small>≈ ${rem.shulkers.toFixed(1)}</small></div></div>
    </div>
    <div class="toolbar">
      <label><input type="checkbox" class="chk" id="rsd" ${S.rawShowDone ? 'checked' : ''}> Show completed${hidden ? ` (${hidden})` : ''}</label>
      <button class="ghost" id="rawCsv">Export CSV</button>
    </div>
    <p class="note">The raw materials needed for everything that's still missing (e.g. piston → planks → logs, cobblestone, iron ingots, redstone). Whatever you checked off in the checklist, already crafted or placed is already subtracted here. Rounding happens only after totaling per intermediate product. "Any Planks/Logs" means the wood type doesn't matter. Use ▸ in the checklist to mark an item as a raw material.</p>
    <table><thead><tr><th style="width:34px"></th><th>Raw material</th><th class="num">Needed</th><th class="hide-m">Stacks</th><th class="num">Have</th><th class="num">Open</th></tr></thead>
    <tbody>${raws.map((n) => {
      const id = n.id, own = st[id] || 0, done = n.missing === 0;
      return `<tr class="item ${done ? 'done' : ''}" data-id="${esc(id)}" data-need="${own + n.missing}">
        <td><input type="checkbox" class="chk" data-act="toggle" ${done ? 'checked' : ''} ${p.combo ? 'disabled' : ''}></td>
        <td><div class="iname">${icon(id)}<span>${esc(MC.displayName(id))}</span>${(p.stopItems || []).includes(id) ? '<span class="pill raw">Raw material</span>' : ''}</div></td>
        <td class="num"><b>${fmt(n.need)}</b></td><td class="hide-m">${stackText(id, n.need)}</td>
        <td class="num">${haveCell(p, id, own)}${n.have > own ? `<div class="sub2">+ ${fmt(n.have - own)} matching in stock</div>` : ''}</td>
        <td class="num">${done ? '<span style="color:var(--accent)">✓</span>' : `${fmt(n.missing)}${n.missing >= MC.stackSize(id) ? `<div style="font-size:11px">${stackText(id, n.missing)}</div>` : ''}`}</td></tr>`;
    }).join('') || '<tr><td colspan="6" style="color:var(--muted);padding:24px;text-align:center">Nothing left to gather 🎉</td></tr>'}</tbody></table>`;
  $('#rsd').onchange = (e) => { S.rawShowDone = e.target.checked; saveUi(); renderRaw(); };
  $('#rawCsv').onclick = () => download(`${p.name}-raw-materials.csv`, toCsv(all.map((n) => ({ id: n.id, count: n.need })), st), 'text/csv');
}

/* ---------- Crafting steps ---------- */
function renderSteps() {
  const p = S.current;
  const steps = Object.values(planOf(p).nodes).filter((n) => n.crafts > 0).sort((a, b) => a.depth - b.depth);
  const finals = new Set(p.items.map((i) => i.id));
  $('#content').innerHTML = `
    <p class="note">Full overview of everything still missing: intermediate products first (planks, sticks, stone bricks …), then the finished blocks. "Left over" shows surplus from recipe quantities. What's up next is in the "Next steps" tab.</p>
    <div class="grid2">
      <div class="card"><h2>Intermediate products</h2><ol class="steps">${stepList(steps.filter((n) => !finals.has(n.id)))}</ol></div>
      <div class="card"><h2>Final products (in the list)</h2><ol class="steps">${stepList(steps.filter((n) => finals.has(n.id)))}</ol></div>
    </div>`;
}
function stepList(steps) {
  if (!steps.length) return '<li style="color:var(--muted);list-style:none">–</li>';
  return steps.map((s) => {
    const ins = Object.entries(s.recipe.in).map(([k, v]) => `${fmt(v * s.crafts)} ${esc(MC.displayName(k))}`).join(', ');
    const surplus = s.produced - s.missing;
    return `<li><div class="iname" style="display:inline-flex">${icon(s.id)}<b>${fmt(s.produced)} ${esc(MC.displayName(s.id))}</b></div>
      <div class="rec">${s.crafts}× ${s.recipe.via ? esc(s.recipe.via) : 'craft'} from ${ins}${surplus ? ` · <span style="color:var(--warn)">${surplus} left over</span>` : ''}</div></li>`;
  }).join('');
}

/* ---------- 3D view ---------- */
async function render3d() {
  const p = S.current, c = $('#content');
  if (!p.has3d) {
    c.innerHTML = `<div class="card" style="max-width:640px"><h2>3D view</h2>
      <p class="note" style="margin-top:0">The .litematic file isn't stored for this project yet (it was imported before this feature existed). Choose the file again. Your list and your progress stay unchanged.</p>
      <button class="primary" id="addSchem">Choose .litematic</button><input type="file" id="schemFile" accept=".litematic" hidden></div>`;
    $('#addSchem').onclick = () => $('#schemFile').click();
    $('#schemFile').onchange = async (e) => {
      const f = e.target.files[0];
      if (!f) return;
      try { await api(`/projects/${p.id}/schematic`, { method: 'POST', body: f }); p.has3d = true; if (S.current === p && S.view === 'view3d') render3d(); }
      catch (err) { toast(err.message, true); }
    };
    return;
  }
  c.innerHTML = `<div class="v3d" id="v3d"><div class="v3d-msg" id="v3dMsg">Loading 3D view …</div></div>`;
  const still = () => S.current === p && S.view === 'view3d' && $('#v3d');
  try {
    const [vox] = await Promise.all([api(`/projects/${p.id}/voxels`), MCA.ready]);
    await new Promise((r) => setTimeout(r, 0));
    if (!still()) return;
    const host = $('#v3d');
    host.insertAdjacentHTML('beforeend', `<div class="v3d-ui">
        <div class="row"><b id="v3dLabel" style="white-space:nowrap"></b><button id="v3dReset" title="Reset camera" style="white-space:nowrap">Reset</button></div>
        <input type="range" id="v3dY" min="1" step="1" aria-label="Layer">
        <div class="row"><label><input type="checkbox" class="chk" id="v3dSingle"> Only this layer</label>
          <span><button id="v3dDown" title="One layer down">−</button> <button id="v3dUp" title="One layer up">+</button></span></div>
        <div class="v3d-layer" id="v3dLayer"></div>
      </div><div class="v3d-help">Drag: rotate · Right-click/Shift+drag: pan · Mouse wheel: zoom</div>`);
    const slider = $('#v3dY'), single = $('#v3dSingle');
    viewer = new MC3D.Viewer(host, vox, (info) => {
      $('#v3dLabel').textContent = `Layer ${info.yMax + 1} / ${info.layers}`;
      $('#v3dLayer').innerHTML = `<div style="color:var(--muted)">${single.checked ? 'In this layer' : 'Top visible layer'} · ${fmt(info.shown)} blocks visible</div>` +
        info.top.map(([name, n]) => `<div>${icon(name)}<span>${esc(MC.displayName(name))}</span><b>${fmt(n)}</b></div>`).join('');
    });
    $('#v3dMsg').remove();
    const layers = viewer.size[1];
    slider.max = layers; slider.value = layers;
    const apply = () => { const y = +slider.value - 1; viewer.setLayers(single.checked ? y : 0, y); };
    slider.oninput = apply; single.onchange = apply;
    $('#v3dDown').onclick = () => { slider.value = Math.max(1, +slider.value - 1); apply(); };
    $('#v3dUp').onclick = () => { slider.value = Math.min(layers, +slider.value + 1); apply(); };
    $('#v3dReset').onclick = () => viewer.resetView();
    if (!MCA.ok) toast('Textures could not be loaded. Blocks are shown in a single color.', true);
  } catch (e) {
    if (still()) $('#v3d').innerHTML = `<div class="v3d-msg">3D view not possible: ${esc(e.message)}</div>`;
  }
}

/* ---------- Edit & export ---------- */
function renderEdit() {
  const p = S.current;
  const text = p.items.map((i) => `${i.id} ${i.count}`).join('\n');
  $('#content').innerHTML = `<div class="grid2">
    <div class="card"><h2>Edit items</h2>
      <p class="note" style="margin-top:0">One line per item: <span class="kbd">id count</span>, e.g. <span class="kbd">stone_bricks 336</span>. The prefix <span class="kbd">minecraft:</span> is optional. Collected amounts are kept.</p>
      <textarea id="ed" spellcheck="false" style="font-family:var(--mono);min-height:340px">${esc(text)}</textarea>
      <div style="display:flex;gap:8px;margin-top:8px"><button class="primary" id="saveEd">Apply</button></div></div>
    <div class="card"><h2>Export</h2>
      <div style="display:flex;flex-direction:column;gap:8px;align-items:flex-start">
        <button id="exJson">Material list as JSON</button>
        <button id="exCsv">Checklist as CSV (Excel)</button>
        <button id="exTxt">Shopping list as text (for Discord/notes)</button>
        ${p.has3d ? `<a href="/api/projects/${p.id}/schematic" download><button type="button">Download schematic (.litematic)</button></a>` : ''}
      </div>
      <h2 style="margin-top:20px">Notes</h2>
      <textarea id="notes" placeholder="Coordinates, storage location, helpers …">${esc(p.notes || '')}</textarea></div>
    <div class="card"><h2>Share</h2>
      ${p.mine ? `<p class="note" style="margin-top:0">These players can see the project, enter amounts, set collection chests and download the schematic. Only you can delete and share. Separate player names with commas.</p>
        <input type="text" id="shared" style="width:100%" placeholder="e.g. Steve, Alex" value="${esc((p.shared || []).join(', '))}">
        <label style="display:flex;gap:6px;align-items:center;margin:10px 0;color:var(--muted)"><input type="checkbox" class="chk" id="inv" ${p.countInventory ? 'checked' : ''}> Count members' inventories while they are online</label>
        <button class="primary" id="saveShare">Save</button>`
      : `<p class="note" style="margin-top:0">This project belongs to ${esc((p.owner || {}).name || '?')} and is shared with you.</p>`}</div></div>`;
  const ss = $('#saveShare');
  if (ss) ss.onclick = () => {
    p.shared = $('#shared').value.split(/[,\s]+/).map((n) => n.trim().toLowerCase()).filter(Boolean);
    p.countInventory = $('#inv').checked;
    persist({ shared: p.shared, countInventory: p.countInventory }); toast('Saved');
  };
  $('#saveEd').onclick = () => {
    const items = [], bad = [];
    $('#ed').value.split('\n').forEach((line, n) => {
      const l = line.trim(); if (!l || l.startsWith('#')) return;
      const m = l.match(/^([a-z0-9_:.\-]+)[\s,;:x×]+(\d+)$/i) || l.match(/^(\d+)\s*[x×]?\s+([a-z0-9_:.\-]+)$/i);
      if (!m) { bad.push(n + 1); return; }
      const [id, c] = /^\d+$/.test(m[1]) ? [m[2], m[1]] : [m[1], m[2]];
      items.push({ id: id.toLowerCase(), count: +c });
    });
    if (bad.length) return toast('Lines not understood: ' + bad.join(', '), true);
    p.items = MC.normalizeItems(items); touch(p);
    persist({ items: p.items }); toast('Saved');
  };
  $('#notes').onchange = (e) => { p.notes = e.target.value; persist({ notes: p.notes }); };
  $('#exJson').onclick = () => download(`${p.name}.json`, JSON.stringify({ name: p.name, items: p.items.map((i) => ({ id: 'minecraft:' + i.id, count: i.count })) }, null, 2), 'application/json');
  $('#exCsv').onclick = () => download(`${p.name}.csv`, toCsv(p.items, stockOf(p)), 'text/csv');
  $('#exTxt').onclick = () => {
    const st = stockOf(p), pl = MC.placedOf(p);
    const openOf = (i) => Math.max(0, i.count - (pl[i.id] || 0) - (st[i.id] || 0));
    const lines = p.items.filter((i) => openOf(i) > 0).sort((a, b) => b.count - a.count).map((i) => {
      const o = openOf(i), ss = MC.stackSize(i.id);
      const st = Math.floor(o / ss), r = o % ss;
      return `- ${MC.displayName(i.id)}: ${o}${st ? ` (${st}×${ss}${r ? ' + ' + r : ''})` : ''}`;
    });
    download(`${p.name}.txt`, `${p.name} – still open\n` + lines.join('\n'), 'text/plain');
  };
}
function toCsv(items, collected) {
  const rows = [['Item', 'ID', 'Count', 'Stacks', 'Remainder', 'Shulker boxes', 'Have']];
  for (const i of items) {
    const ss = MC.stackSize(i.id);
    rows.push([MC.displayName(i.id), i.id[0] === '#' ? '' : 'minecraft:' + i.id, i.count, Math.floor(i.count / ss), i.count % ss, (MC.slotsFor(i.id, i.count) / SHULKER).toFixed(2), collected ? (collected[i.id] || 0) : '']);
  }
  return '﻿' + rows.map((r) => r.map((v) => `"${String(v).replace(/"/g, '""')}"`).join(',')).join('\n');
}
function download(name, data, type) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([data], { type }));
  a.download = name.replace(/[\\/:*?"<>|]/g, '_');
  a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

/* ---------- Automatic refresh ---------- */
// Fetches new data from the server (collection chests, build progress, changes by teammates) without reloading the page
const stamp = (x) => `${x.updated}|${x.syncTime != null ? x.syncTime : (x.sync && x.sync.time) || 0}`;
let lastRefresh = 0, refreshing = false;
async function refreshNow(manual) {
  if (!S.me || refreshing) return;
  refreshing = true; lastRefresh = Date.now();
  try {
    const list = await api('/projects');
    if (JSON.stringify(list) !== JSON.stringify(S.projects)) { S.projects = list; renderSidebar(); }
    const p = S.current;
    if (!p || saveTimer || saving) return;
    // don't redraw in the middle of typing, in the editor or in the 3D view
    const el = document.activeElement;
    const busy = (el && el.matches('#content input[type=number], #content input[type=text], #content textarea')) || S.view === 'view3d' || S.view === 'edit';
    if (p.combo) { if (!busy && p.parts.some((q) => { const sum = list.find((x) => x.id === q.id); return !sum || stamp(sum) !== stamp(q); })) await openCombo(); return; }
    const sum = list.find((x) => x.id === p.id);
    if (!sum) { if (manual) toast('This project no longer exists', true); return; }
    if (stamp(sum) === stamp(p) || busy) return;
    const np = await api('/projects/' + p.id);
    if (S.current !== p || saveTimer || saving) return;
    S.current = np;
    rerender();
  } catch (e) { if (manual) toast('Refresh failed: ' + e.message, true); }
  finally { refreshing = false; const b = $('#refreshBtn'); if (b) b.title = 'Refresh now (last ' + new Date().toLocaleTimeString(LOCALE) + ')'; }
}
setInterval(() => { if (S.refresh > 0 && !document.hidden && Date.now() - lastRefresh >= S.refresh * 1000) refreshNow(); }, 1000);
// Back in the tab (e.g. from the game): reload immediately instead of waiting for the next tick
document.addEventListener('visibilitychange', () => { if (!document.hidden && S.refresh > 0) refreshNow(); });
window.addEventListener('focus', () => { if (S.refresh > 0 && Date.now() - lastRefresh > 1500) refreshNow(); });

/* ---------- Start ---------- */
(async () => {
  try { S.me = await api('/me'); } catch { return; }
  $('#who').innerHTML = `${esc(S.me.name)}${S.me.local ? '' : ' · <a href="#" id="logout" style="color:inherit">Log out</a>'}`;

  const lo = $('#logout');
  if (lo) lo.onclick = async (e) => { e.preventDefault(); try { await api('/logout', { method: 'POST' }); } catch {} showLogin(); };
  try { S.custom = await api('/custom-recipes'); } catch {}
  await loadProjects();
  let last = null;
  try { last = JSON.parse(localStorage.getItem('mcml-ui') || '{}').lastId; } catch {}
  S.combo = new Set([...S.combo].filter((id) => S.projects.some((p) => p.id === id)));
  if (last && S.projects.some((p) => p.id === last)) openProject(last);
  else if (S.projects[0]) openProject(S.projects[0].id);
  else render();
})();
</script>
