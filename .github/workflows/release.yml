name: Release

# Publishes a GitHub release with the jar from mod/build/ attached, when a tag like v2.0.0 is pushed
# or a pushed commit message contains [release] (the tag is then v<version from fabric.mod.json>).
on:
  push:
    tags: ["v*"]
    branches: ["**"]

permissions:
  contents: write

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/') || contains(github.event.head_commit.message, '[release]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pick tag
        id: tag
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else echo "name=v$(python3 -c "import json;print(json.load(open('mod/resources/fabric.mod.json'))['version'])")" >> "$GITHUB_OUTPUT"; fi

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          target_commitish: ${{ github.sha }}
          name: Materiallist-Litematica ${{ steps.tag.outputs.name }}
          files: mod/build/*.jar
          fail_on_unmatched_files: true
          body: |
            Material lists for building projects as a website, served straight from the Minecraft server.

            **Requires:** Minecraft 26.3, Fabric Loader, Fabric API. Litematica is optional (client only).

            - **Server / singleplayer:** put the jar into the `mods` folder, start the game, then follow the in-game command to log in on the website.
            - **Client (optional):** with Litematica installed, placements are detected automatically and build progress is synced.

            See the [README](https://github.com/${{ github.repository }}#readme) for setup details.
